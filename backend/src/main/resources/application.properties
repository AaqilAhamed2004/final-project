spring.application.name=aura-backend

# Server Configuration (Run on port 8000 to match Python backend)
server.port=8000

# MongoDB Configuration
spring.mongodb.uri=mongodb://${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/aura_db

# JWT Configuration
aura.jwt.secret=${SECRET_KEY:aura-secret-change-this-to-a-long-random-string-minimum-32-chars}
# Expiration in minutes (FastAPI default is 480 mins)
aura.jwt.expiration-minutes=${ACCESS_TOKEN_EXPIRE_MINUTES:480}

# ── Jackson JSON Serialization ──────────────────────────────────────────────
# Use snake_case for all JSON output to match the React frontend's expected field names
# (e.g., priority_level, full_name, created_at, road_status, is_public, etc.)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# ── Async Configuration (for @Async AI analysis tasks) ─────────────────────
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
