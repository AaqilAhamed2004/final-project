spring.application.name=aura-backend

# Server Configuration (Run on port 8000 to match Python backend)
server.port=8000

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URL:mongodb://localhost:27017}/${DB_NAME:aura_db}

# JWT Configuration
aura.jwt.secret=${SECRET_KEY:aura-secret-change-this-to-a-long-random-string-minimum-32-chars}
# Expiration in minutes (FastAPI default is 480 mins)
aura.jwt.expiration-minutes=${ACCESS_TOKEN_EXPIRE_MINUTES:480}
